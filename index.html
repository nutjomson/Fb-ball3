c.innerHTML='<section class="panel"><div class="row"><div><h2>Results & Fixtures</h2><small>ผลการแข่งขันและโปรแกรมลีก</small></div></div><div class="tabs history-tabs"><button data-rview="club" class="'+(resultsView==='club'?'active':'')+'">My Club</button><button data-rview="all" class="'+(resultsView==='all'?'active':'')+'">All Matches</button></div><div class="filter-row"><label>Season</label><select id="fixtureSeason">'+seasonOptions+'</select>'+(resultsView==='all'?'<label>Matchweek</label><select id="fixtureWeek">'+weeks.map(w=>'<option value="'+w+'" '+(w===fixtureWeek?'selected':'')+'>Week '+w+(w===(archive?38:S.round)?' · '+(archive?'Final':'Current'):'')+'</option>').join('')+'</select>':'')+'</div>'+(resultsView==='club'?'<p class="muted">'+(team(S.club)?.name||'My Club')+' · แสดงโปรแกรมครบทั้ง 38 สัปดาห์ เรียงตามลำดับการแข่งขัน</p>'+clubHtml:weekHtml)+'</section>';
document.querySelectorAll('[data-rview]').forEach(b=>b.onclick=()=>{resultsView=b.dataset.rview;draw(me)});
$('#fixtureSeason').onchange=e=>{fixtureSeason=+e.target.value;fixtureWeek=fixtureSeason===S.season?S.round:38;draw(me)};
let fw=$('#fixtureWeek');if(fw)fw.onchange=e=>{fixtureWeek=+e.target.value;draw(me)};
}
if(tab==='history'){
 let archives=(S.seasonArchive||[]).slice().sort((a,b)=>b.season-a.season);
 let currentTable=standings().map((t,i)=>({rank:i+1,id:t.id,name:t.name,played:t.played,w:t.w,d:t.d,l:t.l,gf:t.gf,ga:t.ga,gd:t.gf-t.ga,pts:t.pts}));
 let current=currentTable.find(x=>x.id===S.club)||{};
 let seasonStatsList=S.teams.flatMap(t=>t.players.map(p=>({playerId:p.id,name:p.name,club:t.id,position:p.pos,ability:p.ovr,stats:p.seasonStats||{apps:0,goals:0,assists:0}})));
 let seasonLeaders=seasonStatsList.slice().sort((a,b)=>(b.stats.goals||0)-(a.stats.goals||0)||(b.stats.assists||0)-(a.stats.assists||0)).filter(x=>(x.stats.goals||0)+(x.stats.assists||0)>0).slice(0,10);
 let seasonCards=archives.map(a=>'<article class="history-season-card"><div class="history-season-top"><div><small>SEASON ARCHIVE</small><h3>'+a.season+'/'+String(a.season+1).slice(-2)+'</h3></div><span class="history-rank">'+(a.userRank?'#'+a.userRank:'—')+'<small>YOUR FINISH</small></span></div><div class="history-season-main"><div class="history-champion"><span>🏆</span><div><small>LEAGUE CHAMPION</small><b>'+(a.champion||'—')+'</b></div></div><div class="history-yourclub"><small>YOUR CLUB</small><b>'+(team(a.userClub)?.name||a.userClub||'—')+'</b><span>'+(a.champion===a.userClub?'🏆 CHAMPIONS':'Final position '+(a.userRank?'#'+a.userRank:'—'))+'</span></div></div><div class="history-season-foot"><span>'+leagueCatalog[S.leagueId].name+'</span><span>'+(a.champion===a.userClub?'Title won':'Season completed')+'</span></div></article>').join('');
 let leaderRows=seasonLeaders.map((p,i)=>'<div class="history-leader-row"><span class="history-leader-rank">'+(i+1)+'</span><div class="history-leader-info"><b>'+p.name+'</b><small>'+(team(p.club)?.name||p.club)+' · '+p.position+'</small></div><div class="history-leader-stat"><b>'+(p.stats.goals||0)+'</b><small>GOALS</small></div><div class="history-leader-stat"><b>'+(p.stats.assists||0)+'</b><small>ASSISTS</small></div><div class="history-leader-stat history-apps"><b>'+(p.stats.apps||0)+'</b><small>APPS</small></div></div>').join('');
 c.innerHTML='<section class="panel history-hero"><div class="history-eyebrow">FIVE REALMS · CLUB RECORD</div><h2>Club History</h2><p>เส้นทางของสโมสรและผลงานใน'+leagueCatalog[S.leagueId].name+'</p><div class="history-current-grid"><div class="history-current-stat"><small>CURRENT SEASON</small><b>'+S.season+'/'+String(S.season+1).slice(-2)+'</b><span>Matchweek '+S.round+'/38</span></div><div class="history-current-stat"><small>LEAGUE POSITION</small><b class="history-position">#'+(current.rank||'—')+'</b><span>'+(current.pts||0)+' points</span></div><div class="history-current-stat"><small>SEASONS COMPLETED</small><b>'+archives.length+'</b><span>'+leagueCatalog[S.leagueId].name+'</span></div></div></section><section class="panel history-archive-panel"><div class="history-section-head"><div><h2>Season Archive</h2><small>ผลการแข่งขันที่บันทึกไว้ เรียงจากฤดูกาลล่าสุด</small></div><span class="history-count">'+archives.length+' SEASONS</span></div>'+(seasonCards||'<div class="history-empty"><span>🏟️</span><b>ยังไม่มีประวัติฤดูกาล</b><small>เมื่อจบฤดูกาลแรก ผลงานจะปรากฏที่นี่</small></div>')+'</section><section class="panel history-leaders-panel"><div class="history-section-head"><div><h2>Season Player Leaders</h2><small>ผู้เล่นที่มีส่วนร่วมกับประตูสูงสุดในฤดูกาลปัจจุบัน</small></div><span class="history-count">TOP 10</span></div>'+(leaderRows?'<div class="history-leader-list">'+leaderRows+'</div>':'<div class="history-empty"><span>⚽</span><b>ยังไม่มีสถิติผู้เล่น</b><small>สถิติจะเริ่มแสดงเมื่อมีการลงแข่งขัน</small></div>')+'</section>';
 
}}
load();
})();
</script></body></html>
